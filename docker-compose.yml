services:
  postgres:
    image: postgres:16
    container_name: banking-postgres
    environment:
      POSTGRES_DB: banking
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking
    ports:
      - "5435:5432"
    volumes:
      - banking-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking -d banking"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: banking-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/banking
      DB_USERNAME: banking
      DB_PASSWORD: banking
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: banking-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  banking-pgdata:
